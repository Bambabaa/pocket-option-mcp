<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Option Dashboard</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0e27;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .controls {
      padding: 6px 12px;
      background: #131722;
      display: flex;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #2a2e39;
      flex-shrink: 0;
    }

    select,
    button {
      padding: 6px 10px;
      background: #1e222d;
      color: #e0e0e0;
      border: 1px solid #2a2e39;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .gate-status {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    .gate {
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
      background: #2a2e39;
    }

    .gate.pass {
      background: #26a69a;
      color: white;
    }

    .gate.put {
      background: #ef5350;
      color: white;
    }

    .toggle {
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 10px;
      cursor: pointer;
      border: 1px solid #2a2e39;
    }

    .toggle.on {
      background: #1565c0;
      color: white;
      border-color: #1565c0;
    }

    .toggle.off {
      background: #2a2e39;
      color: #787b86;
    }

    .charts-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .replay-controls {
      padding: 10px 16px;
      background: #1a1e29;
      display: none;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #2a2e39;
      flex-shrink: 0;
    }

    .replay-controls.active {
      display: flex;
    }

    .replay-btn {
      padding: 6px 12px;
      background: #2a2e39;
      color: #e0e0e0;
      border: 1px solid #3c4252;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }

    .replay-btn:hover {
      background: #3c4252;
    }

    .replay-btn.play {
      background: #26a69a;
      border-color: #26a69a;
    }

    .replay-slider-container {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type=range] {
      flex: 1;
      cursor: pointer;
    }

    .edge-finder-panel {
      padding: 6px 16px;
      background: #1a1e29;
      display: none;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-start;
      border-bottom: 1px solid #2a2e39;
      flex-shrink: 0;
    }

    .edge-finder-panel.active {
      display: flex;
    }

    .edge-section {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding-right: 12px;
      border-right: 1px solid #2a2e39;
      align-items: center;
    }

    .edge-section:last-of-type {
      border-right: none;
      padding-right: 0;
    }

    .edge-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .edge-group label {
      font-size: 10px;
      color: #787b86;
      font-weight: 600;
    }

    .edge-group input[type=range] {
      width: 70px;
      height: 4px;
      cursor: pointer;
    }

    .edge-val {
      color: #e0e0e0;
      font-size: 11px;
      margin-left: 4px;
      font-family: monospace;
    }

    .scoreboard {
      margin-left: auto;
      padding: 6px 12px;
      background: #1e222d;
      border: 1px solid #2a2e39;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      gap: 8px;
      align-self: center;
    }

    .score-real {
      color: #787b86;
    }

    .score-sim {
      color: #ffb74d;
    }

    .panel {
      position: relative;
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid #2a2e39;
      min-height: 0;
    }

    .panel:last-child {
      border-bottom: none;
    }

    .panel-label {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #787b86;
      z-index: 10;
      pointer-events: none;
    }

    #mainPanel {
      flex: 3;
    }

    #stcPanel {
      flex: 1;
    }

    #stochPanel {
      flex: 1;
    }

    #cciPanel {
      flex: 1;
    }

    /* chart containers fill their panel */
    .chart-host {
      width: 100%;
      flex: 1;
      min-height: 0;
    }
  </style>
</head>

<body>

  <div class="controls">
    <label>Asset: <select id="assetSelect"></select></label>
    <label>Interval:
      <select id="intervalSelect">
        <option value="0">Off</option>
        <option value="5000">5s</option>
        <option value="10000" selected>10s</option>
        <option value="30000">30s</option>
      </select>
    </label>
    <label>Max Candles:
      <select id="limitSelect">
        <option value="500">500</option>
        <option value="1000" selected>1000</option>
        <option value="2000">2000</option>
        <option value="5000">5000</option>
      </select>
    </label>
    <button onclick="loadData()">Refresh</button>
    <button id="signalToggle" class="toggle on" onclick="toggleSignals()">Signals: ON</button>
    <button id="replayToggle" class="toggle off" onclick="toggleReplay()">Replay: OFF</button>
    <button id="edgeToggle" class="toggle off" onclick="toggleEdgeFinder()">Edge Finder: OFF</button>
    <span id="sigCount" style="font-size:11px;color:#787b86;">0 signals</span>
    <span id="historyWarning" style="color:#ef5350; font-size:11px; display:none;"
      title="Some older signals are hidden because the candle window is too small">⚠️ Older signals hidden</span>
    <div class="gate-status">
      <div id="g1" class="gate">G1</div>
      <div id="g2" class="gate">G2</div>
      <div id="g3" class="gate">G3</div>
      <div id="g4c" class="gate">G4C</div>
      <div id="g4p" class="gate">G4P</div>
    </div>
  </div>

  <div class="replay-controls" id="replayBar">
    <button class="replay-btn" onclick="stepBackward()">⏮ Step Back</button>
    <button class="replay-btn play" id="playBtn" onclick="togglePlay()">▶ Play</button>
    <button class="replay-btn" onclick="stepForward()">⏭ Step Fwd</button>

    <label style="font-size: 13px; color: #787b86; margin-left: 10px;">Speed:
      <select id="replaySpeed" style="padding: 4px;">
        <option value="2000">0.5x (2s)</option>
        <option value="1000" selected>1x (1s)</option>
        <option value="500">2x (0.5s)</option>
        <option value="250">4x (0.25s)</option>
        <option value="100">MAX (0.1s)</option>
      </select>
    </label>

    <div class="replay-slider-container">
      <span style="font-size: 12px; color: #787b86;">Timeline:</span>
      <input type="range" id="replaySlider" min="1" max="100" value="100" oninput="onSliderScrub()">
    </div>
  </div>

  <div class="edge-finder-panel" id="edgePanel">
    <div class="edge-section">
      <div class="edge-group" style="flex-direction:row; align-items:center; gap:8px;">
        <input type="checkbox" id="sim_bb_req" onchange="runSimulation()" checked>
        <label for="sim_bb_req" style="margin:0; font-size:11px; color:#e0e0e0; cursor:pointer;"
          title="Require candle to pierce/touch the outer Bollinger Bands within the lookback window">BB Pierce</label>
      </div>
    </div>

    <div class="edge-section">
      <div class="edge-group">
        <label>Div Gap <span class="edge-val" id="val_stoch">0.5</span></label>
        <input type="range" id="sim_stoch" min="0" max="2" step="0.1" value="0.5" oninput="runSimulation()">
      </div>
      <div class="edge-group">
        <label>O/U Zone <span class="edge-val" id="val_stoch_ou">OFF</span></label>
        <input type="range" id="sim_stoch_ou" min="50" max="100" step="5" value="100" oninput="runSimulation()">
      </div>
      <div class="edge-group" style="flex-direction:row; align-items:center; gap:8px;">
        <input type="checkbox" id="sim_stoch_escape" onchange="runSimulation()">
        <label for="sim_stoch_escape" style="margin:0; font-size:11px; color:#e0e0e0; cursor:pointer;"
          title="Require crossover deep in O/U extreme, then confirmation inside the 20-80 Neutral zone">Zone
          Escape</label>
      </div>
    </div>

    <div class="edge-section">
      <div class="edge-group">
        <label>Min CCI <span class="edge-val" id="val_cci">100</span></label>
        <input type="range" id="sim_cci" min="50" max="200" step="10" value="100" oninput="runSimulation()">
      </div>
      <div class="edge-group">
        <label>STC Call <span class="edge-val" id="val_stcc">25</span></label>
        <input type="range" id="sim_stcc" min="0" max="50" step="1" value="25" oninput="runSimulation()">
      </div>
      <div class="edge-group">
        <label>STC Put <span class="edge-val" id="val_stcp">85</span></label>
        <input type="range" id="sim_stcp" min="50" max="100" step="1" value="85" oninput="runSimulation()">
      </div>
    </div>

    <div class="edge-section">
      <div class="edge-group">
        <label>Confluence</label>
        <select id="sim_conf" onchange="runSimulation()"
          style="font-size:11px; padding:2px; background:#1e222d; color:#d1d4dc; border:1px solid #2a2e39;">
          <option value="4" selected>4 Gates (all)</option>
          <option value="3">3 Gates</option>
          <option value="2">2 Gates</option>
          <option value="1">1 Gate</option>
        </select>
      </div>
      <div class="edge-group">
        <label>Lookback Tol. <span class="edge-val" id="val_lookback">0</span></label>
        <input type="range" id="sim_lookback" min="0" max="10" step="1" value="0" oninput="runSimulation()">
      </div>
    </div>

    <div class="scoreboard">
      <span class="score-real">HIST: <span id="count_real">0</span></span>
      <span class="score-sim">SIM: <span id="count_sim">0</span></span>
      <button onclick="exportSimConfig()" title="Export current simulator settings as JSON" style="font-size:10px;padding:2px 7px;background:#1e222d;color:#787b86;border:1px solid #2a2e39;border-radius:3px;cursor:pointer;margin-left:8px;">⬇ JSON</button>
    </div>
  </div>

  <div class="charts-wrap">
    <div class="panel" id="mainPanel">
      <span class="panel-label">Candles + BB</span>
      <div class="chart-host" id="mainChart"></div>
    </div>
    <div class="panel" id="stcPanel">
      <span class="panel-label">STC</span>
      <div class="chart-host" id="stcChart"></div>
    </div>
    <div class="panel" id="stochPanel">
      <span class="panel-label">Stoch K / D</span>
      <div class="chart-host" id="stochChart"></div>
    </div>
    <div class="panel" id="cciPanel">
      <span class="panel-label">CCI-8</span>
      <div class="chart-host" id="cciChart"></div>
    </div>
  </div>

  <script>
    const { createChart, LineStyle } = LightweightCharts;

    // ── chart + series refs ───────────────────────────────────────────
    let mainChart, stcChart, stochChart, cciChart;
    let candleSeries, bbUpper, bbMiddle, bbLower;
    let stcLine, stochKLine, stochDLine, cciLine;

    let intervalId;
    let isSyncing = false;  // prevents circular sync callbacks
    let signalsVisible = true;
    let cachedMarkers = [];  // stored so toggle doesn't need a re-fetch

    // ── replay mode state ─────────────────────────────────────────────
    let fullCandles = [], fullIndicators = [], fullSignals = [];
    let isReplayMode = false;
    let replayIndex = 0;
    let isPlaying = false;
    let replayTimer = null;

    // ── edge finder state ─────────────────────────────────────────────
    let isEdgeFinderMode = false;
    let simulatedSignals = [];

    // ── shared chart options ──────────────────────────────────────────
    const BASE = {
      layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
      grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
      crosshair: { mode: 1 },
      rightPriceScale: { borderColor: '#2a2e39' },
      timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: false }
    };

    function newChart(id, showTimeAxis) {
      const el = document.getElementById(id);
      return createChart(el, {
        ...BASE,
        width: el.clientWidth,
        height: el.clientHeight,
        timeScale: { ...BASE.timeScale, visible: showTimeAxis }
      });
    }

    function resizeAll() {
      [[mainChart, 'mainChart'], [stcChart, 'stcChart'], [stochChart, 'stochChart'], [cciChart, 'cciChart']]
        .forEach(([chart, id]) => {
          const el = document.getElementById(id);
          chart.resize(el.clientWidth, el.clientHeight);
        });
    }

    // Add dashed/dotted threshold price lines to a series
    function addThresholds(series, defs) {
      defs.forEach(({ price, color, style = LineStyle.Dashed, title = '' }) =>
        series.createPriceLine({ price, color, lineWidth: 1, lineStyle: style, axisLabelVisible: false, title })
      );
    }

    // Bidirectional time-scale sync — all charts scroll/zoom together
    function syncAll(charts) {
      charts.forEach(src => {
        src.timeScale().subscribeVisibleLogicalRangeChange(range => {
          if (isSyncing || !range) return;
          isSyncing = true;
          charts.forEach(t => { if (t !== src) t.timeScale().setVisibleLogicalRange(range); });
          isSyncing = false;
        });
      });
    }

    // ── initialise all four charts ────────────────────────────────────
    function initCharts() {
      // Candle chart
      mainChart = newChart('mainChart', true);
      candleSeries = mainChart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350',
        borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350'
      });
      bbUpper = mainChart.addLineSeries({ color: '#2962ff', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
      bbMiddle = mainChart.addLineSeries({ color: '#546e7a', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
      bbLower = mainChart.addLineSeries({ color: '#2962ff', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });

      // STC — no time axis (middle panel)
      stcChart = newChart('stcChart', false);
      stcLine = stcChart.addLineSeries({ color: '#42a5f5', lineWidth: 2, priceLineVisible: false });
      addThresholds(stcLine, [
        { price: 25, color: '#26a69a', title: '25' },
        { price: 85, color: '#ef5350', title: '85' }
      ]);

      // Stochastic — no time axis (middle panel)
      stochChart = newChart('stochChart', false);
      stochKLine = stochChart.addLineSeries({ color: '#2196f3', lineWidth: 2, priceLineVisible: false });
      stochDLine = stochChart.addLineSeries({ color: '#ff9800', lineWidth: 2, priceLineVisible: false });
      addThresholds(stochKLine, [
        { price: 30, color: '#26a69a', title: '30' },
        { price: 80, color: '#ef5350', title: '80' }
      ]);

      // CCI — show time axis on bottom panel only
      cciChart = newChart('cciChart', true);
      cciLine = cciChart.addLineSeries({ color: '#ab47bc', lineWidth: 2, priceLineVisible: false });
      addThresholds(cciLine, [
        { price: 100, color: '#ef5350', title: '100' },
        { price: -100, color: '#26a69a', title: '-100' },
        { price: 175, color: '#ef5350', style: LineStyle.SparseDotted, title: '175' },
        { price: -150, color: '#26a69a', style: LineStyle.SparseDotted, title: '-150' }
      ]);

      // Link all time scales — scroll/zoom one, all follow
      syncAll([mainChart, stcChart, stochChart, cciChart]);

      window.addEventListener('resize', resizeAll);
    }

    // ── data loading ──────────────────────────────────────────────────
    // ── signal markers ────────────────────────────────────────────────
    function buildMarkers(signals, candles, isSimulated = false) {
      if (!candles || candles.length === 0) return [];

      return signals.map(s => {
        // Find closest candle time <= signal time so it snaps to the chart properly
        let snappedTime = s.timestamp;
        let closest = candles.find(c => c.timestamp === s.timestamp);
        if (!closest) {
          let best = candles[0];
          for (let i = 0; i < candles.length; i++) {
            if (candles[i].timestamp <= s.timestamp) {
              best = candles[i];
            } else {
              break;
            }
          }
          snappedTime = best.timestamp;
        }

        const isCall = s.direction === 'CALL';
        let color;
        if (isSimulated) {
          color = '#ffb74d'; // Orange/Yellow for sim
        } else {
          if (s.result === 'WIN') color = '#26a69a'; // green
          else if (s.result === 'LOSS') color = '#ef5350'; // red
          else color = '#787b86'; // grey — pending/unresolved
        }

        return {
          time: snappedTime,
          position: isCall ? 'belowBar' : 'aboveBar',
          shape: isCall ? 'arrowUp' : 'arrowDown',
          color,
          size: 1,
          text: s.result ?? ''
        };
      });
    }

    function applyMarkers(markers) {
      // lightweight-charts requires markers sorted by time
      const sorted = [...markers].sort((a, b) => a.time - b.time);
      candleSeries.setMarkers(sorted);
    }

    function toggleSignals() {
      signalsVisible = !signalsVisible;
      const btn = document.getElementById('signalToggle');
      btn.textContent = signalsVisible ? 'Signals: ON' : 'Signals: OFF';
      btn.className = 'toggle ' + (signalsVisible ? 'on' : 'off');

      if (isEdgeFinderMode) {
        if (signalsVisible) applyMarkers(cachedMarkers);
        else applyMarkers([]);
      } else {
        applyMarkers(signalsVisible ? cachedMarkers : []);
      }
    }

    async function loadAssets() {
      const assets = await fetch('/api/assets').then(r => r.json());
      const sel = document.getElementById('assetSelect');
      sel.innerHTML = assets.map(a => `<option value="${a}">${a}</option>`).join('');
      if (!assets.length) return;

      // Pre-select the first asset that has signals in the current window
      for (const asset of assets) {
        const sigs = await fetch(`/api/signals?asset=${asset}&limit=150`).then(r => r.json());
        if (sigs.length > 0) {
          sel.value = asset;
          break;
        }
      }
      loadData();
    }

    async function loadData() {
      const asset = document.getElementById('assetSelect').value;
      if (!asset) return;

      const limit = document.getElementById('limitSelect').value;

      [fullCandles, fullIndicators, fullSignals] = await Promise.all([
        fetch(`/api/candles?asset=${asset}&limit=${limit}`).then(r => r.json()),
        fetch(`/api/indicators?asset=${asset}&limit=${limit}`).then(r => r.json()),
        fetch(`/api/signals?asset=${asset}`).then(r => r.json())
      ]);

      if (!isReplayMode) {
        replayIndex = fullCandles.length;
      }

      const slider = document.getElementById('replaySlider');
      slider.max = fullCandles.length;
      if (!isReplayMode) slider.value = fullCandles.length;

      renderFrame(replayIndex);

      if (!isReplayMode) mainChart.timeScale().fitContent();
    }

    function renderFrame(index) {
      if (!fullCandles || fullCandles.length === 0) return;

      if (index < 1) index = 1;
      if (index > fullCandles.length) index = fullCandles.length;

      isSyncing = true; // Block sync during bulk setData

      const currentCandles = fullCandles.slice(0, index);
      const currentLastTimestamp = currentCandles[currentCandles.length - 1].timestamp;
      const currentSignals = fullSignals.filter(s => s.timestamp <= currentLastTimestamp);

      candleSeries.setData(currentCandles.map(c => ({ time: c.timestamp, open: c.open, high: c.high, low: c.low, close: c.close })));

      const indMap = new Map();
      fullIndicators.forEach(i => indMap.set(i.timestamp, i));

      const getAlignedSeries = (key) => currentCandles.map(c => {
        const ind = indMap.get(c.timestamp);
        if (ind && ind[key] != null) return { time: c.timestamp, value: ind[key] };
        return { time: c.timestamp };
      });

      bbUpper.setData(getAlignedSeries('bb_upper'));
      bbMiddle.setData(getAlignedSeries('bb_middle'));
      bbLower.setData(getAlignedSeries('bb_lower'));

      stcLine.setData(getAlignedSeries('schaff_value'));
      stochKLine.setData(getAlignedSeries('stochastic_k_v2'));
      stochDLine.setData(getAlignedSeries('stochastic_d_v2'));
      cciLine.setData(getAlignedSeries('cci_8'));

      if (isEdgeFinderMode) {
        runSimulation();
      } else {
        cachedMarkers = buildMarkers(currentSignals, currentCandles);
        if (signalsVisible) applyMarkers(cachedMarkers);
        document.getElementById('sigCount').textContent = cachedMarkers.length + ' signal' + (cachedMarkers.length !== 1 ? 's' : '');
      }

      if (currentCandles.length > 0 && currentSignals.length > 0) {
        const oldestCandle = currentCandles[0].timestamp;
        const oldestSignal = currentSignals[0].timestamp;
        document.getElementById('historyWarning').style.display = (oldestSignal < oldestCandle) ? 'inline' : 'none';
      }

      const gateCandles = currentCandles.slice(-25);
      const gateBars = gateCandles.map(c => ({ can: c, ind: indMap.get(c.timestamp) || null }));
      updateGates(gateBars);

      isSyncing = false;
      document.getElementById('replaySlider').value = index;
    }

    function updateGates(gateBars) {
      // call=teal (pass), put=red (put), neither=dark grey (gate)
      const setGate = (id, callPass, putPass) => {
        const el = document.getElementById(id);
        el.className = callPass ? 'gate pass' : putPass ? 'gate put' : 'gate';
      };

      if (!gateBars || !gateBars.length) {
        ['g1', 'g2', 'g3', 'g4c', 'g4p'].forEach(id => document.getElementById(id).className = 'gate');
        return;
      }

      const last = gateBars[gateBars.length - 1].ind;
      if (!last) return;

      // G4: STC hook at current bar with delta bounds (matches live bot exactly)
      const stcDelta = (last.schaff_value != null && last.prev_schaff_value != null)
        ? (last.schaff_value - last.prev_schaff_value) : null;
      const g4c = stcDelta != null && last.prev_schaff_value <= 25 && stcDelta >= 0 && stcDelta < 0.5;
      const g4p = stcDelta != null && last.prev_schaff_value >= 85 && stcDelta <= 0 && stcDelta >= -0.9;
      setGate('g4c', g4c, false);
      setGate('g4p', false, g4p);

      // G1: candle pierced BB band within last 3 bars AND bb_width_bps >= 10
      let g1c = false, g1p = false;
      for (let i = Math.max(0, gateBars.length - 3); i < gateBars.length; i++) {
        const { can, ind } = gateBars[i];
        if (!ind || !can || ind.bb_width_bps == null || ind.bb_width_bps < 10) continue;
        if (can.low <= ind.bb_lower) g1c = true;
        if (can.high >= ind.bb_upper) g1p = true;
      }
      setGate('g1', g1c, g1p);

      // G2: stoch cross from extreme zone
      // Real bot: cross at C-1, zone check at pre-cross bar C-2, confirm at current bar C
      let g2c = false, g2p = false;
      if (gateBars.length >= 3) {
        const c2 = gateBars[gateBars.length - 3].ind;
        const c1 = gateBars[gateBars.length - 2].ind;
        const c0 = gateBars[gateBars.length - 1].ind;
        if (c2 && c1 && c0 && c2.stochastic_k_v2 != null && c1.stochastic_k_v2 != null && c0.stochastic_k_v2 != null) {
          const diff = Math.abs(c0.stochastic_k_v2 - c0.stochastic_d_v2);
          // CALL: cross up at C-1, K/D both < 30 at C-2, K < 50 and spreading at C
          if (c2.stochastic_k_v2 <= c2.stochastic_d_v2 && c1.stochastic_k_v2 > c1.stochastic_d_v2
            && c2.stochastic_k_v2 < 30 && c2.stochastic_d_v2 < 30
            && c0.stochastic_k_v2 < 50 && diff > 0.5) g2c = true;
          // PUT: cross down at C-1, K/D both > 80 at C-2, K > 50 and spreading at C
          if (c2.stochastic_k_v2 >= c2.stochastic_d_v2 && c1.stochastic_k_v2 < c1.stochastic_d_v2
            && c2.stochastic_k_v2 > 80 && c2.stochastic_d_v2 > 80
            && c0.stochastic_k_v2 > 50 && diff > 0.5) g2p = true;
        }
      }
      setGate('g2', g2c, g2p);

      // G3: CCI crossed ±100 with depth < -150 (CALL) or > 175 (PUT) in 10 bars before cross
      let g3c = false, g3p = false;
      const cciVals = gateBars.map(b => b.ind ? b.ind.cci_8 : null);
      for (let x = 1; x < cciVals.length; x++) {
        const prev = cciVals[x - 1], curr = cciVals[x];
        if (prev == null || curr == null) continue;
        if (!g3c && prev < -100 && curr >= -100) {
          const slice = cciVals.slice(Math.max(0, x - 10), x).filter(v => v != null);
          if (slice.length && Math.min(...slice) < -150) g3c = true;
        }
        if (!g3p && prev > 100 && curr <= 100) {
          const slice = cciVals.slice(Math.max(0, x - 10), x).filter(v => v != null);
          if (slice.length && Math.max(...slice) > 175) g3p = true;
        }
      }
      setGate('g3', g3c, g3p);
    }

    // ── replay mode functions ─────────────────────────────────────────
    function toggleReplay() {
      isReplayMode = !isReplayMode;
      const btn = document.getElementById('replayToggle');
      const bar = document.getElementById('replayBar');

      if (isReplayMode) {
        btn.textContent = 'Replay: ON';
        btn.className = 'toggle on';
        bar.classList.add('active');

        clearInterval(intervalId); // Pause live refresh

        // Jump back 100 candles to give room to play
        replayIndex = Math.max(1, fullCandles.length - 100);
        renderFrame(replayIndex);

        // Force the chart to not auto-scale time axis to fit content, so it looks like it's growing
        mainChart.timeScale().scrollToPosition(10, true);
      } else {
        btn.textContent = 'Replay: OFF';
        btn.className = 'toggle off';
        bar.classList.remove('active');

        if (isPlaying) togglePlay();

        startInterval();

        replayIndex = fullCandles.length;
        renderFrame(replayIndex);
        mainChart.timeScale().fitContent();
      }
      setTimeout(resizeAll, 0);
    }

    function stepForward() {
      if (!isReplayMode) return;
      if (replayIndex < fullCandles.length) {
        replayIndex++;
        renderFrame(replayIndex);
      } else if (isPlaying) {
        togglePlay(); // Pause at end
      }
    }

    function stepBackward() {
      if (!isReplayMode) return;
      if (replayIndex > 1) {
        replayIndex--;
        renderFrame(replayIndex);
      }
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('playBtn');
      if (isPlaying) {
        btn.textContent = '⏸ Pause';
        btn.classList.remove('play');
        const speed = parseInt(document.getElementById('replaySpeed').value);
        replayTimer = setInterval(stepForward, speed);
      } else {
        btn.textContent = '▶ Play';
        btn.classList.add('play');
        clearInterval(replayTimer);
      }
    }

    document.getElementById('replaySpeed').addEventListener('change', () => {
      if (isPlaying) {
        clearInterval(replayTimer);
        const speed = parseInt(document.getElementById('replaySpeed').value);
        replayTimer = setInterval(stepForward, speed);
      }
    });

    function onSliderScrub() {
      if (!isReplayMode) return;
      if (isPlaying) togglePlay();
      replayIndex = parseInt(document.getElementById('replaySlider').value);
      renderFrame(replayIndex);
    }

    // ── edge finder functions ─────────────────────────────────────────
    function toggleEdgeFinder() {
      isEdgeFinderMode = !isEdgeFinderMode;
      const btn = document.getElementById('edgeToggle');
      const panel = document.getElementById('edgePanel');
      if (isEdgeFinderMode) {
        btn.textContent = 'Edge Finder: ON';
        btn.className = 'toggle on';
        panel.classList.add('active');
        runSimulation();
      } else {
        btn.textContent = 'Edge Finder: OFF';
        btn.className = 'toggle off';
        panel.classList.remove('active');
        renderFrame(replayIndex); // restores original signals
      }
      setTimeout(resizeAll, 0);
    }

    function runSimulation() {
      if (!isEdgeFinderMode) return;

      const pBBReq = document.getElementById('sim_bb_req').checked;
      const pStoch = parseFloat(document.getElementById('sim_stoch').value);
      const pStochOU = parseInt(document.getElementById('sim_stoch_ou').value);
      const pStochEscape = document.getElementById('sim_stoch_escape').checked;
      const pCCI = parseFloat(document.getElementById('sim_cci').value);
      const pSTCc = parseFloat(document.getElementById('sim_stcc').value);
      const pSTCp = parseFloat(document.getElementById('sim_stcp').value);
      const pConf = parseInt(document.getElementById('sim_conf').value);
      const pLookback = parseInt(document.getElementById('sim_lookback').value);

      document.getElementById('val_stoch').textContent = pStoch;
      document.getElementById('val_stoch_ou').textContent = (pStochOU === 100) ? 'OFF' : (pStochOU + '/' + (100 - pStochOU));
      document.getElementById('val_cci').textContent = pCCI;
      document.getElementById('val_stcc').textContent = pSTCc;
      document.getElementById('val_stcp').textContent = pSTCp;
      document.getElementById('val_lookback').textContent = pLookback;

      simulatedSignals = [];
      const currentCandles = fullCandles.slice(0, replayIndex);
      if (currentCandles.length === 0) return;
      const currentLastTimestamp = currentCandles[currentCandles.length - 1].timestamp;

      const candleMap = new Map();
      fullCandles.forEach(c => candleMap.set(c.timestamp, c));

      let lastFireIndex = -100;

      const boundOB = pStochOU === 100 ? 80 : pStochOU;
      const boundOS = pStochOU === 100 ? 20 : (100 - pStochOU);

      for (let i = 0; i < fullIndicators.length; i++) {
        const ind = fullIndicators[i];
        if (ind.timestamp > currentLastTimestamp) break;

        // ── STC: evaluated at current bar only (trigger gate, not a window gate) ──
        const stcDelta = (ind.schaff_value != null && ind.prev_schaff_value != null)
          ? ind.schaff_value - ind.prev_schaff_value : null;
        const stcc_pass = (stcDelta != null && ind.prev_schaff_value <= pSTCc && stcDelta >= 0) ? 1 : 0;
        const stcp_pass = (stcDelta != null && ind.prev_schaff_value >= pSTCp && stcDelta <= 0) ? 1 : 0;

        // ── BB, Stoch, CCI: all sweep the same pLookback window ──
        let bb_call_pass = 0, bb_put_pass = 0;
        let stoch_call_pass = 0, stoch_put_pass = 0;
        let cci_call_pass = 0, cci_put_pass = 0;

        let currentNeutral = (ind.stochastic_k_v2 > boundOS && ind.stochastic_k_v2 < boundOB);
        let crossedExtremeCall = false, crossedExtremePut = false;

        for (let step = 0; step <= pLookback; step++) {
          if (i - step < 0) break;
          const pi = fullIndicators[i - step];
          const pc = candleMap.get(pi.timestamp);

          // G1 — BB pierce within window
          if (!bb_call_pass || !bb_put_pass) {
            if (pBBReq) {
              if (pc) {
                if (pc.low <= pi.bb_lower) bb_call_pass = 1;
                if (pc.high >= pi.bb_upper) bb_put_pass = 1;
              }
            } else {
              bb_call_pass = 1; bb_put_pass = 1;
            }
          }

          // G2 — Stoch divergence within window
          if (pStochEscape) {
            if (pi.stochastic_k_v2 <= boundOS && pi.stochastic_d_v2 <= boundOS &&
              pi.stochastic_k_v2 > pi.stochastic_d_v2 &&
              Math.abs(pi.stochastic_k_v2 - pi.stochastic_d_v2) > pStoch) crossedExtremeCall = true;
            if (pi.stochastic_k_v2 >= boundOB && pi.stochastic_d_v2 >= boundOB &&
              pi.stochastic_k_v2 < pi.stochastic_d_v2 &&
              Math.abs(pi.stochastic_k_v2 - pi.stochastic_d_v2) > pStoch) crossedExtremePut = true;
          } else {
            const div = pi.stochastic_k_v2 != null && pi.stochastic_d_v2 != null &&
              Math.abs(pi.stochastic_k_v2 - pi.stochastic_d_v2) > pStoch;
            const os = pStochOU === 100 ? true : (pi.stochastic_k_v2 <= boundOS);
            const ob = pStochOU === 100 ? true : (pi.stochastic_k_v2 >= boundOB);
            if (div && os) stoch_call_pass = 1;
            if (div && ob) stoch_put_pass = 1;
          }

          // G3 — CCI depth within window
          if (pi.cci_8 != null) {
            if (pi.cci_8 < -pCCI) cci_call_pass = 1;
            if (pi.cci_8 > pCCI) cci_put_pass = 1;
          }
        }

        if (pStochEscape) {
          stoch_call_pass = (currentNeutral && crossedExtremeCall) ? 1 : 0;
          stoch_put_pass = (currentNeutral && crossedExtremePut) ? 1 : 0;
        }

        // Confluence: BB + Stoch + CCI (window) + STC (current bar) = max 4
        const callConf = bb_call_pass + stoch_call_pass + cci_call_pass + stcc_pass;
        const putConf = bb_put_pass + stoch_put_pass + cci_put_pass + stcp_pass;

        // Cooldown: suppress re-firing within pLookback bars of last signal
        const inCooldown = (i - lastFireIndex) <= pLookback;

        if (callConf >= pConf && !inCooldown) {
          simulatedSignals.push({ timestamp: ind.timestamp, direction: 'CALL', result: 'SIM' });
          lastFireIndex = i;
        } else if (putConf >= pConf && !inCooldown) {
          simulatedSignals.push({ timestamp: ind.timestamp, direction: 'PUT', result: 'SIM' });
          lastFireIndex = i;
        }
      }

      cachedMarkers = buildMarkers(simulatedSignals, currentCandles, true);
      if (signalsVisible) applyMarkers(cachedMarkers);

      const currentSignals = fullSignals.filter(s => s.timestamp <= currentLastTimestamp);
      document.getElementById('count_real').textContent = currentSignals.length;
      document.getElementById('count_sim').textContent = simulatedSignals.length;
      document.getElementById('sigCount').textContent = 'Viewing ' + simulatedSignals.length + ' simulated signals';
    }

    // ── controls ──────────────────────────────────────────────────────
    document.getElementById('assetSelect').addEventListener('change', loadData);
    document.getElementById('limitSelect').addEventListener('change', loadData);
    function exportSimConfig() {
      const pStochOU = parseInt(document.getElementById('sim_stoch_ou').value);
      const config = {
        bb_pierce:   document.getElementById('sim_bb_req').checked,
        div_gap:     parseFloat(document.getElementById('sim_stoch').value),
        ou_zone:     pStochOU === 100 ? 'OFF' : pStochOU,
        zone_escape: document.getElementById('sim_stoch_escape').checked,
        cci_min:     parseFloat(document.getElementById('sim_cci').value),
        stc_call:    parseFloat(document.getElementById('sim_stcc').value),
        stc_put:     parseFloat(document.getElementById('sim_stcp').value),
        confluence:  parseInt(document.getElementById('sim_conf').value),
        lookback:    parseInt(document.getElementById('sim_lookback').value)
      };
      const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sim_config.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function startInterval() {
      clearInterval(intervalId);
      const ms = parseInt(document.getElementById('intervalSelect').value);
      if (ms > 0) intervalId = setInterval(loadData, ms);
    }

    document.getElementById('intervalSelect').addEventListener('change', startInterval);

    // Defer until after the browser has painted the flex layout so
    // clientWidth/clientHeight return real pixel values, not 0.
    requestAnimationFrame(() => {
      initCharts();
      loadAssets();
      startInterval();
    });
  </script>
